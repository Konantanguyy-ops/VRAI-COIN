name: Securite
on:
 push:
 branches: [ main ]
 pull_request:
 branches: [ main ]
jobs:
 check-securite:
 runs-on: ubuntu-latest
 steps:
 - name: Recuperer le code
 uses: actions/checkout@v4
 - name: Verifier innerHTML
 run: |
 if grep -r "innerHTML" --include="*.html" --include="*.js" --exclude-dir=.github .; then echo DANGER; exit 1; else echo OK; fi
 - name: Verifier eval
 run: |
 if grep -r "eval(" --include="*.html" --include="*.js" --exclude-dir=.github .; then echo DANGER; exit 1; else echo OK; fi
